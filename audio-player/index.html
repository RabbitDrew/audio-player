<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./CSS/common.css" />
    <link rel="stylesheet" href="./CSS/main.css" />

    <!--fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>Player</title>
  </head>
  <body class="page">
    <main class="page-container">
      <div class="container-player">
        <!--cover-->
        <div class="player-cover__wrapper">
          <img
            class="cover-img"
            src="./assets/img/Kyli_Watson.jpg"
            alt="cover"
          />
        </div>
        <!--controls-->
        <div class="track-display__wrapper">
          <h1 class="dispaly-title">Kyle Watson ft Kylah Jasmine - You Boy</h1>

          <div class="display-bars__wrapper">
            <div class="progress-bar__wrapper">
              <div class="progress-bar"></div>
            </div>

            <div class="display-volume__wrapper">
              <img
                class="volume_img"
                src="./assets/control_btns/volume.png"
                alt="volume"
              />
            </div>

            <div class="volume-level__wrapper hide__volume">
              <label for="volumeControl" class="volume-level"></label>
              <input
                class="input-volume"
                type="range"
                id="volumeControl"
                min="0"
                max="1"
                step="0.01"
                value="1"
              />
            </div>
          </div>

          <div class="display-time">
            <h2 class="curr-time">00:00</h2>
            <span class="slash">/</span>
            <h2 class="full-time">03:00</h2>
          </div>

          <div class="dispaly-control__wrapper">
            <div class="control_btn backward">
              <img
                class="control_img backward"
                src="./assets/control_btns/backward.png"
                alt="backward"
              />
            </div>
            <div class="control_btn play_pause">
              <img
                class="control_img play_img"
                src="./assets/control_btns/play.png"
                alt="play"
              />
            </div>
            <div class="control_btn forward">
              <img
                class="control_img forward"
                src="./assets/control_btns/forward.png"
                alt="forward"
              />
            </div>

            <audio
              class="audio"
              src="./assets/audio/Kyle_Watson_You_Boy_ft_Kylah_Jasmine.mp3"
            ></audio>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">

      <div class="footer-container">
        <div class="footer-git__Wrapper">

          <a class="git-link" href="https://github.com/RabbitDrew">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink"
              viewBox="0,0,256,256"
              width="40px"
              height="40px"
            >
              <g
                fill="#000"
                fill-rule="nonzero"
                stroke="none"
                stroke-width="1"
                stroke-linecap="butt"
                stroke-linejoin="miter"
                stroke-miterlimit="10"
                stroke-dasharray=""
                stroke-dashoffset="0"
                font-family="none"
                font-weight="none"
                font-size="none"
                text-anchor="none"
                style="mix-blend-mode: normal"
              >
                <g transform="scale(16,16)">
                  <path
                    d="M7.5,1c-3.58984,0 -6.5,2.90625 -6.5,6.48828c0,2.86719 1.86328,5.30078 4.44531,6.16016c0.32422,0.05859 0.55469,-0.27344 0.55469,-0.52344c0,-0.15234 0.00391,-0.33594 0,-0.875c-1.80859,0.39063 -2.375,-0.875 -2.375,-0.875c-0.29687,-0.75 -0.65625,-0.96484 -0.65625,-0.96484c-0.58984,-0.40234 0.04297,-0.39062 0.04297,-0.39062c0.65234,0.04297 0.98828,0.60547 0.98828,0.60547c0.5,0.875 1.62891,0.78906 2,0.625c0,-0.39844 0.04297,-0.6875 0.15234,-0.87109c-2.04297,-0.35937 -3.15625,-1.53906 -3.15234,-3.17188c0.00391,-0.96484 0.33594,-1.71484 0.875,-2.26953c-0.23437,-0.29687 -0.39453,-1.3125 0.08594,-1.9375c1.20703,0 1.92578,0.87109 1.92578,0.87109c0,0 0.56641,-0.24609 1.60938,-0.24609c1.04687,0 1.60937,0.23438 1.60937,0.23438c0,0 0.72266,-0.85937 1.92969,-0.85937c0.48047,0.625 0.32031,1.64063 0.13281,1.91797c0.51563,0.54297 0.83203,1.29297 0.83203,2.28906c0,1.63281 -1.10937,2.8125 -3.14844,3.16797c0.12891,0.19531 0.14844,0.46875 0.14844,0.875c0,0.86719 0,1.66016 0,1.875c0,0.25 0.22656,0.58594 0.55859,0.52344c2.58203,-0.86328 4.44141,-3.29297 4.44141,-6.16016c0,-3.58203 -2.91016,-6.48828 -6.5,-6.48828z"

                </g>
              </g>
            </svg>
            <h2 class="git-title">RabbitDrew</h2>
          </a>

        </div>
        <div class="footer-year-wrapper">
          <h2 class="year">2024</h2>
        </div>
        <div class="footer-rs-wrapper">
          <a class="school-link" href="https://rs.school/courses">
            <img  class="school_img" src="./assets/footer_img/rsschool.png" alt="rsschool">
          </a>
        </div>
      </div>
     
    </footer>

    <script src="./js/index.js"></script>
  </body>
</html>
